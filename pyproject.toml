[project]
name = "regale"
version = "0.1.0"
description = "Modular, horizontally and vertically scalable ETL framework for Python, with native pandas integration and independently configurable query/transform/load workers."
readme = "README.md"
authors = [
    { name = "Lucas Monteiro", email = "lucasmontmsantos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
]
license = "Apache-2.0"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
