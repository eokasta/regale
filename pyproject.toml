[project]
name = "regale"
version = "0.1.0"
description = "Modular, horizontally and vertically scalable ETL framework for Python, with native pandas integration and independently configurable query/transform/load workers."
readme = "README.md"
authors = [
    { name = "Lucas Monteiro", email = "lucasmontmsantos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=17",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]
license = "Apache-2.0"

[project.scripts]
regale = "regale.cli:app"

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.1", "adbc-driver-postgresql>=1.0", "adbc-driver-manager>=1.0"]
all = ["regale[redis,postgres]"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "regale[redis]",
    "fakeredis>=2.20",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
